[general]
bars = 8
framerate = 60
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto
sample_rate = 48000
sample_bits = 16
channels = 2
active = 1
remix = 1
virtual = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
integral = 65
noise_reduction = 8
monstercat = 1
waves = 0
