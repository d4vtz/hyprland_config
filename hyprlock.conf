source = ~/.config/hypr/themes/current-hyprlock.conf

general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    color = $background
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $foreground
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %d de %B'
    color = $comment
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $purple
    inner_color = $current_line
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span foreground="##6272a4">Contraseña</span>
    fail_text = <span foreground="##ff5555">$FAIL</span>
    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}
